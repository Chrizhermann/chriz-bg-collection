[[changes]]
id = "chriz-iwd-encounters-0.3.2"
title = "Chriz IWD Encounters v0.3.2: mixed elite squads, Kaylessa as a weapons master, Poquelin's dispel back in the finale"
summary = "New installations pin Chriz IWD Encounters v0.3.2. Chapters 2-6 replace the uniform five-man squads with six mixed squads with real multiclasses, using SCS caster and combat AI, Kaylessa fights as a level-15 elven weapons master switching between bow and sword, the related quests need fewer kills, and an endless staircase respawn is fixed. In the finale Poquelin's transformation dispels the party again as in the base game, so buffs cast outside the church no longer carry the fight. The optional Heart of Winter and Trials of the Luremaster overhaul repairs the Polar Bear Spirit's roar, thins Burial Isle's undead, puts a Frost Giant War-Shaman with two Frost Giant Jarls on the glacier in Gloomfrost, and replaces out-of-place humans in the Sea of Moving Ice with a remorhaz, a yeti elder and a sahuagin royal guard. A game already in progress keeps its existing encounters."
save_applicability = "new-game-only"
urgency = "recommended"
