id = "chriz-iwd-encounters-0.3.0"
title = "Chriz IWD Encounters v0.3.0 brings Baldur's Gate spell rules, Chapter 2-6 overhaul, and boss updates"
summary = "New installations pin Chriz IWD Encounters v0.3.0 with two new defaults (component 120 for Baldur's Gate caster-level Dispel/Remove Magic, Minor Spell Deflection L1-4, non-stacking Mirror/Reflected/Spirit Armor, AoE Mirror Image bypass, logical status immunities, and Universal utility schools; component 420 for Chapter 2-6 filler thinning, Kresselack crypt wave pacing, Terikan/Tarnsen/Ginafae fixes, upgraded Severed Hand/Giant/Wyrm fights, and five Drasus/Iron-Throne-style squads), updated Belhifet/Yxunomei/Poquelin encounters (300, 310, 360), and optional component 500 for Heart of Winter and Trials of the Luremaster. A game already in progress keeps its existing encounters."
