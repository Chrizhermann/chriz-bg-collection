summary = "Pins Chriz IWD Encounters v0.3.4 (was v0.3.2), aligning all thinned-area quest kill counters (Dragon's Eye Level 2 Talonite >5/<6, Severed Hand ELVEN_SOLDIER >11, Dorn's Deep 8001_Salamanders >8 and 8008_Salamanders >4), preserving quest death variables on AR4002/AR5403 squad actors, fixing triple-stacked AC/THAC0/APR mastery stats on CIE4xx/CIE5xx elites, marking bespoke elite gear and AI buff potions undroppable, stretching Kresselack's antechamber wave timers to 48s/+54s, removing the remaining Bombardier Beetles in Dragon's Eye and Burial Isle, adding six apex encounters in Chapters 2-5, and thinning additional late-chapter and Watchknight hordes. Existing 0.1.15-0.1.16 installs receive the quest-counter repair as a current-save hotpatch (component 425)."
