id = "chriz-iwd-encounters-0.2.0"
title = "Chriz IWD Encounters 0.2.0: twelve boss fights"
summary = "Christopher's fight mod adds twelve boss fights, on by default: the orog raid on Kuldahar, Yxunomei, Joril, Maiden Ilmadia, the Idol, Poquelin in the Ascension Cave, Cryshal-Tirith, Belhifet, Mebdinga, Icasaracht, Lord Maluradek and the Luremaster. They are harder through behaviour and tactics, with more hit points where it fits; each works with and without Sword Coast Stratagems. A game already in progress gets them through the hotpatch."
save_applicability = "new-game-only"
urgency = "recommended"
