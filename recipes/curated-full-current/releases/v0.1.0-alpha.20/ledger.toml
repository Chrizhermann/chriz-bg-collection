[[changes]]
id = "challenge-mode-emotion-optional"
title = "Challenge Mode; Emotion's no-stack rule becomes optional"
summary = "Emotion: Courage and Hope do not stack is now unchecked and part of Challenge Mode; its effect is unchanged. Challenge Mode switches its members on or off together, and each stays individually adjustable. The SoD Insane bridge option's description changes wording only."
save_applicability = "next-playthrough"
urgency = "recommended"
covers = [
  "feature:feature:chriz-bg-rebalance:component-301",
  "feature:feature:chriz-sod-remix:component-257",
]

[[changes]]
id = "eet-desktop-shortcut-optional"
title = "EET's desktop shortcut is optional"
summary = "EET: Create desktop shortcut is now unchecked. EET's shortcut starts the game without EEex and replaces an existing EET.lnk on the desktop; the installer's own shortcut starts the game correctly."
save_applicability = "next-playthrough"
urgency = "recommended"
covers = [
  "feature:feature:eet:component-100",
]

[[changes]]
id = "bard-spell-level-ceilings-default"
title = "Bard spell-level ceilings"
summary = "Recommended new installations limit Blades, Skalds and Dancers to 6th-level spells. Other bards, Jesters included, reach 7th at bard level 21; Kapellmeisters and Darkbloom reach 8th at bard level 29. Bardic Wonders kits are covered when Bardic Wonders is installed. Requires EEex; existing characters gain the capacity at their next level-up."
save_applicability = "next-playthrough"
urgency = "recommended"
covers = [
  "feature:feature:chriz-bg-rebalance:bard-spell-ceilings",
  "feature:feature:bardicwonders:component-3010",
  "run:chriz-bg-rebalance-bg2",
  "run:bardicwonders-progression-bg2",
]

[[changes]]
id = "bardic-balance-7-blade-and-battleluck"
title = "Bardic Wonders Blade and Battleluck"
summary = "Bardic Wonders balance.7: with the Blade Overhaul, Blades may put two weapon slots into the listed swords, daggers, axes, spears and halberds, and Two-Weapon Style stops at three. Battleluck lasts five rounds, affects the caster and allies within 30 feet, and refreshes instead of stacking."
save_applicability = "next-playthrough"
urgency = "recommended"
