[[changes]]
id = "reader-level-scroll-casting"
title = "Scrolls use the reader's caster level"
summary = "Replaces the fixed Use Any Item scroll level. Casters use their active caster level of the scroll's type; other legitimate readers use half their highest active class level, minimum 1. Requires EEex. It is now a recommended default instead of mandatory and installs in its own final run, after every spell and item change."
