[[changes]]
id = "kitpack-and-bardic-save-and-rest-fixes"
title = "Passive kit abilities and bard songs no longer block saving or resting"
summary = "Awareness, Combat Casting and Tracking from Artisan's Kitpack, and songs, Inspirations and kit auras from Bardic Wonders, now allow you to save and rest while their passive effects are active. Visible enemies and active combat can still prevent saving or resting."
