]

[[changes]]
id = "rebalance-round-clock-time-jumps"
title = "Round Clock counts time spent travelling and resting"
summary = "Round Clock (BG Rebalance v0.8.12, component 361) counts time passed during travel, rest and scripted time jumps toward your next spell, item use or attack, the wait after using Hide in Shadows and the next contingency check. If Hide in Shadows is ready, you can use Stealth while paused. Round Clock is on by default with EEex."
save_applicability = "next-playthrough"
urgency = "informational"
covers = [
  "artifact:chriz-bg-rebalance-0.8.12",
  "feature:feature:chriz-bg-rebalance:component-361",
  "run:chriz-bg-rebalance-bg2",
]

