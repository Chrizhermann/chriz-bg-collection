[[changes]]
id = "modpack-reader-level-scrolls-stay-on"
title = "Scrolls at the reader's caster level stay on"
summary = "Scrolls at the reader's caster level, a recommended default, now stay on for the whole session. With Modpack alpha.11 to alpha.13 they could turn off after a load, a new game, an NPC joining or opening a container, with an EEex message box, and scrolls then cast at their normal level until the game was restarted. Technical notices now go to the game's loader log; only in one rare case, when the scroll rule can neither start cleanly nor undo its start, does a single box ask you to restart the game as it starts. (Chriz BG Modpack alpha.14)"
save_applicability = "next-playthrough"
urgency = "recommended"
covers = [
  "artifact:chriz-bg-modpack-0.2.0-alpha.14",
]

[[changes]]
id = "scs-fine-weapons-and-ammunition"
title = "Fine weapons that never break"
summary = "Recommended new installations turn most standard +1 weapons into nonmagical fine weapons (SCS): still +1 to hit and damage, but no initiative bonus, no harm to creatures immune to normal weapons, and about a third of the price. They never break in BG1's iron crisis. Fine ammunition, the same change for +1 arrows, bolts, darts and sling bullets, is offered unchecked and is not part of Challenge Mode; Protection from Normal Missiles stops it."
save_applicability = "next-playthrough"
urgency = "recommended"
covers = [
  "feature:feature:stratagems:component-3010",
  "feature:feature:stratagems:component-3021",
  "run:stratagems-bg2",
]

[[changes]]
id = "rebalance-potion-doses-and-heroism"
title = "One potion dose of each type; Heroism effects don't combine"
summary = "Recommended new installations allow one dose of each potion type at a time: drinking a type that is already active restarts its duration instead of stacking its bonus, and Heroism, Power and other potions that raise maximum hit points keep the first dose until it ends. Potions of Genius still stack, and different potion types still combine. The strict version, where Genius does not stack either, is offered unchecked and is part of Challenge Mode. Heroism, Greater Heroism (Bardic Wonders), their copies and the Potion of Heroism don't combine either: the first one active on a creature wins. Song of Heroism, Aid and the Potion of Power stay separate. (BG Rebalance v0.8.3)"
save_applicability = "next-playthrough"
urgency = "recommended"
covers = [
  "artifact:chriz-bg-rebalance-0.8.3",
  "feature:feature:chriz-bg-rebalance:component-330",
