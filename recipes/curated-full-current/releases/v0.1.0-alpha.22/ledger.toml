[[changes]]
id = "modpack-join-xp-for-every-npc"
title = "Join XP for every joinable NPC"
summary = "Recommended new installations give NPCs whose scripts lack EET's join-XP catch-up, mostly from mods, EET's own: on joining in Shadows of Amn they rise to the highest protagonist XP threshold reached, from 125,000 up to 1,250,000, and in Throne of Bhaal to 2,500,000. Sarah, for example, used to join at 89,000 XP. It never lowers XP and does not repeat when an NPC rejoins. Fade's and Evandra's join XP now recognises a catch-up they already have under EET instead of adding a second one. (Chriz BG Modpack alpha.13)"
save_applicability = "next-playthrough"
urgency = "recommended"
covers = [
  "artifact:chriz-bg-modpack-0.2.0-alpha.13",
  "feature:feature:chriz-bg-modpack:component-239",
  "run:chriz-bg-modpack-late-companions-bg2",
]

