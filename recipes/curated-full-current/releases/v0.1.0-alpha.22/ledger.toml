[[changes]]
id = "modpack-campaign-xp-caps-work-and-chapter-caps"
title = "Campaign XP caps work; chapter-by-chapter caps"
summary = "The optional, experimental campaign XP caps with banked XP now work, on EEex v1.3.1 too. With Modpack alpha.11 and alpha.12 no character got a bank account, so with the caps installed every permanent XP award was refused, the optional Shadows of Amn cap included. Script variables are no longer lost at the next save when the bank could not take an XP change; if the bank cannot start, XP stays uncapped and unbanked, and the reason goes to the game's loader log. New, optional and experimental instead of the Shadows of Amn cap: chapter-by-chapter caps, from 16,000 usable XP in BG1 Chapters 1-2 up to 8,900,000 in Throne of Bhaal's last chapter, with XP above the cap banked until a later chapter raises it. With them, Baeloth's Larswood scene waits for Chapter 5, so his starting XP fits under the cap. The chapter caps have not been played through the story yet. (Chriz BG Modpack alpha.13 and alpha.14)"
save_applicability = "next-playthrough"
urgency = "optional"
covers = [
  "artifact:chriz-bg-modpack-0.2.0-alpha.13",
