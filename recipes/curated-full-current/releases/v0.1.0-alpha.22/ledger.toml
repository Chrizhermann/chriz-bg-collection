[[changes]]
id = "kitpack-kit-weapon-fixes"
title = "Kit weapon fixes"
summary = "New installations use the Artisan's Kitpack fork chriz.5. Sorcerers, the Dragon Disciple included, can equip daggers, quarterstaves, darts and slings again without proficiency points, like mages. Eldritch Knight and Arcane Trickster sorcerers keep their kit weapons when they level up or join the party. Monks can equip quarterstaves with Monk Revisions, and shamans without a kit, Sacred Fists, Enlightened Fists and Ninjas are held to their weapons from the start. The Invisible Blade and Bardic Wonders' Dancer can use katanas and the rogue and bard items that kept them out by mistake, also those that later mods add, such as SCS's Drow Katana; the Shapeshifter and the Elementalist still cannot use them. Existing games keep the old weapon behavior."
save_applicability = "next-playthrough"
urgency = "recommended"
