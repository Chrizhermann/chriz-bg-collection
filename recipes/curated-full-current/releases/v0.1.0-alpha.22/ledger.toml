[[changes]]
id = "rebalance-chris-revisions"
title = "Chris Revisions: Aid, Luck, Bless, Chaotic Commands, Prayer and Recitation"
summary = "Recommended new installations add Christopher's own spell balance changes, with or without Spell Revisions. Aid grants only hit points, 1d8 +1 per caster level (at most +10), and casting it again replaces the bonus. Luck lasts 90 seconds. Bless lasts 30 seconds plus 1 round per caster level. Druids can cast Bless and Chaotic Commands again, and rangers Bless. Prayer and Recitation no longer stack: Recitation's bonus or penalty replaces Prayer's while it lasts. Exact copies, such as Bardic Wonders' Troubadour Aid, change with them. (BG Rebalance v0.8.5)"
save_applicability = "next-playthrough"
urgency = "recommended"
covers = [
  "artifact:chriz-bg-rebalance-0.8.5",
  "feature:feature:chriz-bg-rebalance:component-340",
  "run:chriz-bg-rebalance-bg2",
]

[[changes]]
id = "rebalance-0-8-4-compatibility-fixes"
title = "BG Rebalance fixes"
summary = "Fixes for BG Rebalance components the collection already installs: Bracers of Blinding Strike and Spell Revisions' Haste or Improved Haste no longer combine when the spell is cast first. A short full immunity, such as SCS's Divine Protection, stays at 100% for as long as it lasts; other party physical resistance stays capped at 90%. Combat cloud forms turn only immunities of 100% or more into 75% resistance, and elemental arrows change only the arrow's bow-fired hit. The Cleric of Tempus rework works with Artisan's Kitpack and other layouts and keeps other mods' visuals, sounds and markers; the optional Emotion spells accept other mods' casting times, ranges, schools and levels. Components that cannot apply a change correctly now stop the installation with the reason instead of guessing. (BG Rebalance v0.8.4)"
save_applicability = "next-playthrough"
urgency = "recommended"
covers = [
  "artifact:chriz-bg-rebalance-0.8.5",
]

[[changes]]
id = "rebalance-true-time-stop-fair-haste-slow"
title = "True Time Stop – fair Haste & Slow"
summary = "Recommended new installations make Time Stop stop everything but the caster, and Haste and Slow change only actions and movement. In a Time Stop, the frozen creatures' spells and potions no longer run out while they cannot act, and their poison and regeneration wait too; everything continues afterwards with the time it had left. Haste and Slow no longer speed up or slow down poison, regeneration and other repeated effects; attacks, actions and movement stay hasted or slowed. Requires EEex. Install it before a playthrough: adding or removing it during one is not supported. Saving, dispelling, curing or dying during a Time Stop are not covered yet. (BG Rebalance v0.8.6, named in v0.8.7)"
save_applicability = "next-playthrough"
urgency = "recommended"
covers = [
  "artifact:chriz-bg-rebalance-0.8.6",
  "artifact:chriz-bg-rebalance-0.8.7",
  "feature:feature:chriz-bg-rebalance:component-360",
  "run:chriz-bg-rebalance-bg2",
]

