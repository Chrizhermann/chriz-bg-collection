id = "rebalance-druid-and-alaghor-weapons"
title = "Druid and Alaghor of Clangeddin weapons"
summary = "Recommended new installations let druids and every druid kit use axes and short bows and put one point into them; fighter/druids can also use long bows, with up to two points in all three. Yeslick's Alaghor of Clangeddin kit trains and uses the cleric weapons plus axes, Clangeddin's weapon, with up to two points; the thief weapons its weapon list allowed drop out, and points already spent stay. The Alaghor change needs EEex and Artisan's Kitpack's weapon rules. (BG Rebalance v0.8.8)"
save_applicability = "next-playthrough"
