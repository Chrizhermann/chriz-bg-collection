[[changes]]
id = "modpack-companion-stat-adjustments"
title = "Companion stat adjustments"
summary = "Recommended new installations change five BG1 companions' base ability scores, each as its own choice: Rasaad Dexterity 17 and Constitution 16; Dorn Constitution 16; Eldoth Strength 17, Constitution 16, Wisdom 9 and Intelligence 14; Garrick Dexterity 17 and Intelligence 15; Quayle Constitution 15. Only the base scores change; class, kit, equipment and current hit points stay as they are. Make Faldorn an Avenger and Teach Dynaheir Haste now also install when only some of the files they patch are present, and say which ones they skipped. (Chriz BG Modpack alpha.12)"
save_applicability = "next-playthrough"
urgency = "recommended"
covers = [
  "artifact:chriz-bg-modpack-0.2.0-alpha.12",
