[[changes]]
id = "bardic-wonders-balance-8-fixes"
title = "Bardic Wonders fixes"
summary = "New installations use Bardic Wonders v2.9c-balance.8. The Troubadour, Deathsinger and New Bard Spells copies of priest spells are now found by the spell's name, so they follow Spell Revisions, and recasting one refreshes it instead of stacking with the earlier cast. The Troubadour and Deathsinger descriptions name the spells the kits actually get. The Gallant now gets the new bard spells; in the collection's install order it got none of them. Symphony of the Dark Children (Abettor of Mask) turns the party invisible again when the song ends; before, nothing happened at the end, and a disabled singer gave Invisibility every round."
save_applicability = "next-playthrough"
urgency = "recommended"
covers = [
  "artifact:bardicwonders-v2.9c-balance.7",
  "artifact:bardicwonders-v2.9c-balance.8",
]

[[changes]]
id = "buffbot-1-12-1"
title = "BuffBot 1.12.1"
summary = "New installations use BuffBot v1.12.1 (was v1.10.0). The \"Combat detected - casting stopped\" and \"casting timed out\" notices now appear over the party leader's head; before, both were always lost, although stopping the buff run worked. New: an optional 2x or 4x speed while a buff run lasts (Normal stays the default), presets that cast their longest-lasting buffs first (Order: Duration; your own order stays the default), and casting buffs that are nearly over again, through the EEex options (off by default) or the panel's Active toggle. Also new: a search by buff name and item powers that work through a spell found automatically. The panel wears the theme's artwork and colours, so its columns are readable on dark themes. The F12 preset abilities are gone: right-click the HUD gear to pick a named preset. BuffBot no longer adds text to the game's dialog.tlk."
save_applicability = "next-playthrough"
urgency = "recommended"
covers = [
  "artifact:buffbot-1.10.1",
  "artifact:buffbot-1.11.0",
  "artifact:buffbot-1.12.1",
]

[[changes]]
id = "buffbot-fixes-to-1-12-1"
title = "BuffBot fixes"
summary = "Fixed in BuffBot v1.11.0 to v1.12.1: a configured spell variant no longer skips its casting time and aura, wearable items are no longer refused to characters without a kit, and restoring temporarily equipped items no longer risks overwriting the first backpack slot on BG2:EE 2.7.3.0, which could corrupt the character's name and crash the game. On a small panel, button captions no longer spill onto the neighbouring buttons, so a click lands on the button you see; spare tab slots stay inside the panel; and the quick-preset menu's captions move with the menu."
save_applicability = "next-playthrough"
urgency = "recommended"
covers = [
  "artifact:buffbot-1.11.0",
  "artifact:buffbot-1.12.1",
]

[[changes]]
id = "eeex-remote-console-0-2-1"
title = "EEex Remote Console keeps the single-player menu in front"
summary = "Optional and experimental: with EEex Remote Console v0.2.1, after you return to the main menu from character creation, the load screen or the options, the single-player menu no longer stays behind the game's screens for the rest of the session. Its installer messages now name the EEex v1.2/v1.3 components it needs."
save_applicability = "next-playthrough"
urgency = "optional"
covers = [
  "artifact:eeexremote-0.2.1",
]

[[changes]]
id = "spell-revisions-chriz-7-encounters-and-lightning"
title = "Spell Revisions fixes for Rogue Rebalancing and Lightning Bolt"
summary = "New installations use the Spell Revisions fork v4.21-chriz.7. With Rogue Rebalancing's encounters, Aran Linvail, the Zhentarim Mercenary and Selina prepare Hold Monster, Feeblemind and Domination in place of Rogue Rebalancing's level-5 Chaos; before, the Chaos copies were moved to level 7, where Aran and the Mercenary could never cast them. The Lightning Bolt choice keeps damage another mod adds to the bolt instead of stopping the installation."
save_applicability = "next-playthrough"
urgency = "recommended"
covers = [
  "artifact:spell-revisions-4.21-chriz.7",
  "artifact:srcb-rr-compat-4.21-chriz.7",
]
