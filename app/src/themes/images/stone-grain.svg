<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <defs>
    <filter id="stone" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.68" numOctaves="4" seed="11" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="mono"/>
      <feComponentTransfer in="mono">
        <feFuncR type="linear" slope="0.24" intercept="0.02"/>
        <feFuncG type="linear" slope="0.26" intercept="0.02"/>
        <feFuncB type="linear" slope="0.30" intercept="0.03"/>
        <feFuncA type="linear" slope="0.075" intercept="0"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="160" height="160" filter="url(#stone)"/>
</svg>
