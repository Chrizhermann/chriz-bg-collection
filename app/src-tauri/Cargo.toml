[package]
name = "chriz-bg-app"
version = "0.1.0-alpha.14"
description = "Installer and launcher for Chriz Easy BG"
edition = "2021"

[lib]
name = "chriz_bg_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
bg_engine = { package = "chriz-bg-engine", path = "../../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-updater = "=2.11.0"
time = { version = "0.3", features = ["formatting"] }
toml = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell"] }

[dev-dependencies]
base64 = "0.22"
minisign = "0.9.1"
# The opt-in updater acceptance test uses Tauri's mock runtime.
tauri = { version = "=2.11.5", features = ["test"] }
tempfile = "3"
