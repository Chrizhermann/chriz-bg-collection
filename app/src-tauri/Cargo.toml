[package]
name = "chriz-bg-app"
version = "0.1.0-alpha.1"
description = "Installer and launcher for Chriz Easy BG"
edition = "2021"

[lib]
name = "chriz_bg_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
bg_engine = { package = "chriz-bg-engine", path = "../../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.3"
toml = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
minisign = "0.9.1"
tempfile = "3"
