name: Own mod pins

# Every installer pins the same, newest release of our own mods, unless a recorded hold in
# manifest/own-mods.toml says why not (docs/own-mod-pins.md). Red when installers disagree,
# when a pull request pins one of our mods but not its newest release, and in a release
# check; otherwise a newer release only shows as a warning.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Release check (every mod on its newest release or held)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Same newest release of our mods in every installer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      # A pull request is checked on the merge of its change into its base, so comparing
      # with the base finds exactly the pins and versions it changes. A push has no such
      # base: after a branch merges its base branch, comparing with the previous tip would
      # count the base branch's changes as the push's own. A push gets the status check.
      - name: Fetch the base of this pull request
        id: base
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git fetch --no-tags --quiet --depth=1 origin "$PR_BASE"; then
            echo "sha=$PR_BASE" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Own mod pins::Could not fetch the base $PR_BASE, so no pin counts as changed by this pull request."
          fi

      - name: Check the pins of our own mods
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.base.outputs.sha }}
          RELEASE: ${{ inputs.release }}
        run: |
          args=(check --fetch --fetch-depth 1)
          if [ -n "$BASE" ]; then args+=(--base "$BASE"); fi
          if [ "$RELEASE" = "true" ]; then args+=(--release); fi
          python -I tools/own_mod_pins.py "${args[@]}"
