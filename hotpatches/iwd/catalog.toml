# Hotpatches of Chriz Easy IWD: new WeiDU components of one pinned mod release, installed after
# everything else into completed installations, so running games get them too. The app bundles
# this folder; each hotpatch's package is pinned below `artifacts/` and `mods/` in the recipe's
# own formats. Design: docs/plans/2026-10-28-iwd-hotpatch.md.
schema = 1
game = "iwdee"

# What the game, its loader, installed mods and the app's own add-ons write into the game folder
# after installation. These never count as the player's own changes or block Undo, and a hotpatch
# neither writes nor restores them. Mods and files players add themselves never block a hotpatch
# either. Lowercase names; `folder/**` is a folder and everything in it, `*` matches within a name.
runtime_files = [
    # InfinityLoader: its settings (it writes cached addresses on every start, the app writes
    # the game log switch), its logs and crash dumps.
    "infinityloader.ini",
    "infinityloader.log",
    "infinityloader-previous.log",
    "infinityloader_crash/**",
    # The pattern databases: on the first start, and whenever the game changes, the loader writes
    # the addresses it found into them. The same first start creates the empty folder
    # EEex_scripts/override; a file put into it still counts as a change. Seen 2026-10-29 in
    # Christopher's played installation and in the 0.1.1 release lab.
    "infinityloader.db",
    "eeex_scripts/extra_pattern_dbs/*.db",
    "eeex_scripts/override",
    # BuffBot 1.12: logs, the generated panel backgrounds, its innate helpers, exported presets.
    "buffbot_*.log",
    "override/bfbotbg*.mos",
    "override/bfbtch.spl",
    "override/bfbtcr.spl",
    "override/bfbot_presets/**",
    # EEex Remote Console, an optional developer tool: its command, result and handshake files.
    "override/eeex_remote_*",
    # BG Radar Overlay, which the app installs and updates itself.
    "bg radar overlay/**",
]

# Christopher's rule (2026-10-28): hotpatches only for installations close to the recommended
# setup. At most `max_changed_mods` other mods may be added, left out or set differently;
# choices in `free_mods` never count, and `required_mods` must stay installed.
[gate]
recommended_preset = "chris-recommended"
max_changed_mods = 2
free_mods = ["cdtweaks", "infinity-ui", "leui-iwdee", "eeex"]
required_mods = ["stratagems"]

