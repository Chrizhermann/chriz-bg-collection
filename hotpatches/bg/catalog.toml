# Mods Chriz Easy BG updates in completed installations. The app bundles this folder; the format
# is the hotpatch catalog's, because an update is a transaction of the same history. Design:
# docs/plans/2026-11-04-buffbot-updater.md.
schema = 1
game = "eet"

# What the game, its loader, installed mods and the app's own add-ons write into the game folder
# after installation. These never block Undo, and an update neither writes nor restores them.
# Lowercase names; `folder/**` is a folder and everything in it, `*` matches within a name.
runtime_files = [
    # InfinityLoader: its settings (it writes cached addresses on every start, the app writes
    # the game log switch), its logs and crash dumps.
    "infinityloader.ini",
    "infinityloader.log",
    "infinityloader-previous.log",
    "infinityloader_crash/**",
    # The pattern databases: on the first start, and whenever the game changes, the loader writes
    # the addresses it found into them. The same first start creates the empty folder
    # EEex_scripts/override; a file put into it still counts as a change.
    "infinityloader.db",
    "eeex_scripts/extra_pattern_dbs/*.db",
    "eeex_scripts/override",
    # BuffBot: logs, the generated panel backgrounds, its innate helpers, exported presets.
    "buffbot_*.log",
    "override/bfbotbg*.mos",
    "override/bfbtch.spl",
    "override/bfbtcr.spl",
    "override/bfbt*.spl",
    "override/bfbot_presets/**",
    # EEex Remote Console, an optional developer tool: its command, result and handshake files.
    "override/eeex_remote_*",
    # BG Radar Overlay, which the app installs and updates itself.
    "bg radar overlay/**",
]

# The format asks for the rule hotpatches follow. Chriz Easy BG offers no hotpatches, so nothing
# reads it yet.
[gate]
recommended_preset = "chris-recommended"
max_changed_mods = 0

# Mods the app updates in finished installations: WeiDU installs the mod's installed components
# again from the new release, seeing it as the last mod, so mods after it are left alone. Undo takes
# back the latest change. The release is the one GitHub marks as Latest when the player checks
# (Christopher, 2026-11-04), checked against the length and SHA-256 GitHub publishes for `asset`
# ({tag} is the release's tag).
[[updates]]
mod = "buffbot"
title = "BuffBot"
summary = "Brings BuffBot in this game to its newest release. Your saves, BuffBot settings and exported presets stay as they are, and so do mods you added."
repository = "Chrizhermann/bg-eeex-buffbot"
asset = "buffbot-{tag}.zip"
