[[feature_groups]]
id = "challenge-mode"
title = "Challenge Mode"
description = "Stricter rules for players who want a harder game. Turns on every Challenge Mode change at once; you can still switch each one on or off under its own mod."
members = [
  "feature:chriz-bg-rebalance:component-301",
  "feature:chriz-bg-modpack:component-235",
  "feature:chriz-bg-rebalance:component-110",
  "feature:chriz-sod-remix:component-257",
]
# Christopher, 2026-10-14: Challenge Mode picks strict potion uniqueness (Rebalance 330);
# switching the group off restores the recommended 331.
variants = [
  { choice_group = "potion-uniqueness", option = "feature:chriz-bg-rebalance:component-330", label = "Potions: strict (Potions of Genius don't stack either)" },
]

