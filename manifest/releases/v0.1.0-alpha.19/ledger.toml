]

[[changes]]
id = "edwin-red-wizard-and-optional-baeloth-spell-limit"
title = "Edwin correction and optional Baeloth balance"
summary = "With Artisan's Red Wizard Edwin, his amulet is removable and extra slots come only from his kit. Optional Baeloth balance limits his spells known to a normal Sorcerer spread, with or without Spell Revisions. Edwin runs after his kit assignment and before SR NPC spellbooks; Baeloth runs after spellbook processing. Saved actors are not automatically rewritten."
save_applicability = "next-playthrough"
urgency = "recommended"
