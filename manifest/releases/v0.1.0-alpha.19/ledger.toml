[[changes]]
id = "elemental-arrows-sr-bracers-and-damageable-clouds"
title = "BG2 elemental arrows, corrected bracers and damageable clouds"
summary = "Recommended new installations use BG2 elemental-arrow damage throughout EET. With Spell Revisions, Bracers of Blinding Strike grant +1 APR rather than doubled attacks. Supported combat cloud forms lose damage immunity in favor of 75% resistance while keeping lower resistances and scripted escapes. These changes do not patch existing games or saves."
save_applicability = "next-playthrough"
urgency = "recommended"
