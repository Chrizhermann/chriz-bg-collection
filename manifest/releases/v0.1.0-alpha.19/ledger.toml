[[changes]]
id = "approved-hardiness-antimagic-and-resistance-defaults"
title = "Hardiness, anti-magic and physical-resistance balance"
summary = "New recommended installations use Hardiness with 40% physical resistance, bounded Pierce Magic resistance reduction, brief Spellstrike disruption, and half effectiveness above 80% party physical resistance with a 90% maximum. Hardiness 30% and extra elemental/magic-damage resistance are separate optional choices. Prerequisites are enforced; no 95% cap is offered."
