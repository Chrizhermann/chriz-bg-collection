[[changes]]
id = "emotion-courage-hope-exclusive-default"
title = "Emotion, Courage and Hope no longer stack"
summary = "New recommended installations use BG Rebalance 0.6.0 component 301: casting Courage or Hope replaces the other on each target, and recasting refreshes it. Christopher approved this default on September 26; any issue will be fixed in a follow-up. Existing installations are unchanged. Bard progression components 420/421 remain unselected."
save_applicability = "next-playthrough"
urgency = "recommended"
