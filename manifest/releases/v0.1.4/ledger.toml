[[changes]]
id = "artisans-kitpack-and-bardic-wonders-save-rest-fixes"
title = "Save and rest with passive kit abilities and bard songs"
summary = "On new installations, you can save and rest while passive kit abilities such as Awareness and Tracking are active, or while a bard sings or maintains an inspiration or aura. Nearby enemies and active combat can still prevent saving and resting. The fixes come from Artisan's Kitpack chriz.7 and Bardic Wonders balance.9."
