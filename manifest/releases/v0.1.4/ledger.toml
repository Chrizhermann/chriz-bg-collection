]

[[changes]]
id = "chriz-bg-rebalance-round-clock"
title = "Round Clock counts game time spent travelling and resting"
summary = "Travel, rest and scripted time jumps now count toward the wait after casting a spell, using an item, swinging a weapon or trying to hide, and toward the next contingency check. When Hide in Shadows is ready again, you can use the Stealth button while paused. Round Clock (BG Rebalance v0.8.12, component 361) is on by default with EEex in new installations."
save_applicability = "next-playthrough"
urgency = "informational"
