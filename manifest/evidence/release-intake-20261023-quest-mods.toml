schema = 1
evidence_kind = "published-release-download-and-native-order-verification"
verified_on = "2026-10-23"
command = "chriz-bg-author artifact inspect <release asset or commit archive URL> --cache-root <fresh cache> --expected-tp2 <tp2>; chriz-bg-author artifact verify <artifact.toml> --cache-root <fresh cache>; python tools/check_native_component_order.py --recipe-root manifest --recipe-root recipes/curated-full-current --mod-id ppe --archive <fresh downloaded ZIP>; source audit of each TP2's component declarations (see below)"
scope = "Six optional third-party quest mods enter both recipe profiles in the Quest mods category, unchecked and experimental: NTotSC at upstream master commit f0ef953 (a commit archive, not release v5.0.0), Ascalon's Questpack v7.0, Black Hearts v2.05 (declared incompatible with the SoD Remix), Thalantyr Item Upgrade v4.5.1, the Icewind Dale Voice Pack 1.2.0 and PPE at DaftHunk fork commit 417226ea. Each archive was first inspected and verified on 2026-10-22 (NTotSC f0ef953 on 2026-10-23), then verified again on 2026-10-23 from the final artifact TOMLs: each was downloaded anonymously into its own new cache and passed the production acquisition and extraction contracts, and its length and SHA-256 match both recipes. Extraction publishes only the mod folder, never a bundled setup executable or readme. The curated profile's artifact TOMLs are byte-identical copies. This is automated source/package verification, not a combined WeiDU install or gameplay acceptance; the lab test comes with the final combined install."

