# One archive serves the main, NPC and tweak installers. Against chriz.4 all three TP2s
# change their VERSION; the main and tweak TP2s also include the new
# lib/shapeshifter_kit_bit.tpa in ALWAYS. The main TP2 calls its pass,
# c0_free_borrowed_shapeshifter_bit, in the Elementalist 5001 and the Invisible Blade 7005
# right after they add their kit; no BEGIN, DESIGNATED, SUBCOMPONENT, GROUP, REQUIRE or
# FORBID line changes, so the 59 components, their order and every recorded decision are
# unchanged. The pass takes the Shapeshifter's usability bit (item byte 0x29, bit 4) off
# items other than body armor where it only stands for the druid kits, for the kits that
# borrow it to keep out of armor and are not druid kits (the Invisible Blade and Bardic
# Wonders' Dancer), and blocks every other kit with the bit there through an opcode 319
# KIT.IDS check marked with the resource C0SHAPE_. A second run without new items or kits
# changes nothing (the fork's tests).
# The curated profile's main run follows this native order. The manifest profile's main
# run keeps the authored order it has had since chriz.1 (10002 before 10001, 1100 after
# 1009), which the order checker rejects; this intake does not change it, and
# engine/tests/production_recipe_artisan.rs pins it. native_order_recipe_profiles names
# the profiles whose runs were checked against this record.
