# One archive serves the main, NPC and tweak installers. Against chriz.3 all three TP2s
# change their VERSION and include the new eeex/class_weapon_grants.tpa in ALWAYS; no
# BEGIN, DESIGNATED, SUBCOMPONENT, GROUP, REQUIRE or FORBID line changes, so components,
# their order and every recorded decision are unchanged. The main TP2 ends each of its 59
# components with "LAF c0_add_c0pr_cl_to_ability_tables END": every class and kit ability
# table, the shaman's CLABSH01 included, applies C0PR#CL at every level. Monk Revisions
# 10001 (lib/MonkRevision.tpa) writes the class weapon grants again after it changes
# WEAPPROF.2DA, so monks are granted quarterstaves; eeex/profs_eeex.tpa and
# lib/profs_eeex_patch.tpa now call the shared library. Both functions do nothing without
# C0PR#CL.SPL, that is without the EEex-based weapon usability.
# The curated profile's main run follows this native order. The manifest profile's main
# run keeps the authored order it has had since chriz.1 (10002 before 10001, 1100 after
# 1009), which the order checker rejects; this intake does not change it, and
# engine/tests/production_recipe_artisan.rs pins it. native_order_recipe_profiles names
# the profiles whose runs were checked against this record.
