scope = "Chriz BG Modpack v0.2.0-alpha.15 for CEBG 0.1.1 (Christopher, 2026-11-03): it replaces alpha.14 in both recipe profiles and adds component 670, Marek carrying the Boomerang Dagger +2 in BG1, as a default. It is a normal GitHub release, not a pre-release, with an annotated tag on the merge commit of Modpack PR #18 (0920504, published 2026-11-03 01:33 UTC). The release ZIP was downloaded anonymously into a fresh cache for the inspection; the manifest artifact TOML's verify fetched it once more into that cache's production namespace, and the curated profile's byte-identical copy verified as a cache hit. Both passed the production acquisition and extraction contracts; length and SHA-256 match the published asset and its digest, and the final host is release-assets.githubusercontent.com. The ZIP's 154 entries (12,549,914 bytes uncompressed, largest entry 8,232,364 bytes, depth 5, highest compression ratio 6.3) stay within the unchanged archive limits of the alpha.14 pin, and the expected TP2 matches directly with the new VERSION on line 3. All 126 files under the published roots match the tag commit's tree byte for byte. Against alpha.14 the tag is exactly one commit ahead, and the release notes say that everything else is unchanged. The native TP2 declaration order matches both recipes. The alpha.14 record and its artifact TOML stay as history. This is automated source/package verification, not a combined WeiDU install or gameplay acceptance; the release reports synthetic WeiDU tests and installs on copies of BG:EE and EET game files, and the two Marek fights and the drop are not yet tested in a game."

# Against alpha.14 the published files that change are the TP2 (VERSION and the new 670
