# "Choose an alternate class for Sirene?". tools/check_native_component_order.py needs
# literal DESIGNATED numbers, so the order was audited by hand: both recipes install 0, 3,
# 6, 7, 8 and 9 in that order. The class components require ~Sirene.tp2~ component 0
# while the file is Setup-Sirene.tp2; the portraits require ~Setup-Sirene.tp2~.
