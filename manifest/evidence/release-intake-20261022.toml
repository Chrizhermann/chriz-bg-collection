schema = 1
evidence_kind = "published-release-download-and-native-order-verification"
verified_on = "2026-10-22"
command = "chriz-bg-author artifact inspect <release asset URL> --cache-root <fresh cache> --expected-tp2 <cd_x/cd_x.tp2>; chriz-bg-author artifact verify <artifact.toml> --cache-root <fresh cache>; source audit of each TP2 declaration (see below)"
scope = "ChrizFader's voicepacks v1.1.0 (18 player voicepacks, published 2026-10-22) enter both recipe profiles as default features under Voicepacks. Each release ZIP was downloaded anonymously into a fresh cache and passed the production acquisition and extraction contracts; its length and SHA-256 match the digest GitHub publishes for the asset and the release voicepacks-manifest.json, and extraction publishes only the cd_* folder (not the bundled setup EXE or Garithos's Extras portraits). Before release, the voicepacks owner installed all 18 cd_* folders with CEBG's pinned WeiDU 249 in six disposable fixtures (BG:EE, BG:EE with SoD, BG2:EE and EET in English; BG:EE and BG2:EE in German): all 18 installs with 671 checked slot mappings, a reinstall, and uninstall restoration of every original file passed, and every pack rejected the classic engine, an old 30-row soundset table and a missing table without changes. This is automated source/package and fixture verification, not a combined collection install or gameplay acceptance."

# tools/check_native_component_order.py needs a literal DESIGNATED per component. Each TP2
# declares exactly one line-start `BEGIN @0`; the 1.0.1 packs leave it undesignated, so
# WeiDU numbers it 0, and the Ajantis 2.0.0, Viconia 1.0.0 and Garithos 1.1.0 TP2s
# designate 0. Every recipe run installs exactly that component 0.
