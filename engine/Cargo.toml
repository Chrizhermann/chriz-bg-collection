[package]
name = "chriz-bg-engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "bg_engine"
path = "src/lib.rs"

[[bin]]
name = "chriz-bg-install"
path = "src/bin/chriz-bg-install.rs"

[[bin]]
name = "chriz-bg-author"
path = "src/bin/chriz-bg-author.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
semver = "1"
minisign-verify = "=0.2.5"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
ureq = { version = "3.4", default-features = false, features = ["rustls", "platform-verifier", "win-system-proxy"] }
sha2 = "0.10"
hex = "0.4"
fs4 = "0.13"
url = "2"
zip = { version = "8", default-features = false, features = ["deflate"] }
sevenz-rust2 = { version = "0.22.2", default-features = false, features = ["util"] }
walkdir = "2"
crossbeam-channel = "0.5"
same-file = "1"
tempfile = "3"
ctrlc = "3"

[target.'cfg(windows)'.dependencies]
pelite = "0.10"
winreg = "0.55"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[dev-dependencies]
minisign = "0.9.1"
tiny_http = "0.12"
sevenz-rust2 = { version = "0.22.2", default-features = false, features = ["compress", "util"] }
